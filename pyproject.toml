[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docstruct"
version = "0.1.0"
requires-python = ">=3.10"

[project.scripts]
train = "src.training.main:main"
serve = "src.model.api.serve:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["src/tests"]
markers = [
    "slow: тесты, требующие загрузки тяжёлых моделей (запуск: pytest -m slow)",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
