model:
  name: Qwen/Qwen2-VL-2B-Instruct
  torch_dtype: bfloat16

quantization:
  enabled: true
  load_in_4bit: true
  quant_type: nf4
  compute_dtype: float16
  use_double_quant: true


lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj

data:
  train_path: data/train
  val_path: data/val

training:
  output_dir: outputs/qwen2vl-2b
  num_train_epochs: 3
  learning_rate: 2.0e-5
  per_device_train_batch_size: 1
  warmup_steps: 5
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  logging_steps: 10
  save_strategy: epoch
  evaluation_strategy: epoch
  metric_for_best_model: eval_json_valid_rate
  